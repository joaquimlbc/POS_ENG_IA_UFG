[pytest]
testpaths = tests
filterwarnings =
    # Own code and first-party warnings must always surface as failures-in-spirit
    # (visible in the summary); only known third-party, dependency-internal
    # deprecations below are silenced, each scoped to its exact source.
    error
    ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning:dateutil.tz.tz
    ignore:Type google\._upb\._message\..*uses PyType_Spec.*:DeprecationWarning
